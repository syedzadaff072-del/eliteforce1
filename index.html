<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#05070d"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    {% include '_pwa_head.html' %}

    <title>ELITE FORCE</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #0c1d32 0%,
                    #050b14 42%,
                    #020409 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =========================================
           BACKGROUND GLOW
        ========================================= */

        .glow {

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 136, 255, 0.15),
                    transparent 68%
                );

            animation:
                pulse 4s ease-in-out infinite;

        }


        @keyframes pulse {

            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }

        }


        /* =========================================
           PARTICLES
        ========================================= */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

        }


        .particle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #35a9ff;

            box-shadow:
                0 0 10px #168cff;

            opacity: 0;

            animation:
                floatParticle linear infinite;

        }


        .particle:nth-child(1) {
            left: 8%;
            animation-duration: 7s;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 18%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            left: 29%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .particle:nth-child(4) {
            left: 41%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            left: 52%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .particle:nth-child(6) {
            left: 63%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .particle:nth-child(7) {
            left: 74%;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .particle:nth-child(8) {
            left: 86%;
            animation-duration: 6s;
            animation-delay: 3s;
        }

        .particle:nth-child(9) {
            left: 94%;
            animation-duration: 9s;
            animation-delay: 1s;
        }


        @keyframes floatParticle {

            0% {
                top: 110%;
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                top: -10%;
                opacity: 0;
            }

        }


        /* =========================================
           MAIN
        ========================================= */

        .splash {

            position: relative;

            z-index: 5;

            width: 90%;

            max-width: 850px;

            text-align: center;

            animation:
                entrance 1.3s ease;

        }


        @keyframes entrance {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        .small-title {

            color: #4bb5ff;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 7px;

            margin-bottom: 18px;

            text-shadow:
                0 0 15px rgba(56,168,255,0.7);

        }


        .title {

            font-size: clamp(
                48px,
                10vw,
                110px
            );

            font-weight: 1000;

            letter-spacing: 7px;

            line-height: 0.95;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #a9dcff 35%,
                    #198fff 100%
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 20px rgba(0,136,255,0.3);

            animation:
                titleGlow 3s ease-in-out infinite;

        }


        @keyframes titleGlow {

            0%,
            100% {
                filter: brightness(0.95);
            }

            50% {
                filter: brightness(1.25);
            }

        }


        .line {

            width: 170px;

            height: 1px;

            margin: 28px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #168cff,
                    transparent
                );

            box-shadow:
                0 0 15px #168cff;

        }


        .created {

            color: #8092a9;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 4px;

        }


        .created span {

            color: #dbeeff;

        }


        .status {

            margin-top: 38px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 9px;

            color: #6f8299;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 3px;

        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #20e77b;

            box-shadow:
                0 0 10px #20e77b;

            animation:
                blink 1.2s infinite;

        }


        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }

        }


        /* =========================================
           LOADER
        ========================================= */

        .loader {

            width: 220px;

            height: 2px;

            margin: 18px auto 0;

            background:
                rgba(255,255,255,0.07);

            overflow: hidden;

            border-radius: 10px;

        }


        .loader-bar {

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #006eff,
                    #4fc0ff
                );

            box-shadow:
                0 0 12px #168cff;

            animation:
                loading 3.5s ease forwards;

        }


        @keyframes loading {

            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }

        }


        /* =========================================
           SCANLINES
        ========================================= */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.018),
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity: 0.35;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .small-title {

                font-size: 8px;

                letter-spacing: 4px;

            }


            .title {

                letter-spacing: 3px;

            }


            .created {

                font-size: 8px;

                letter-spacing: 2px;

            }


            .loader {

                width: 180px;

            }

        }

    
        /* =========================================
           RESPONSIVE (all devices)
        ========================================= */
        html { -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        .title {
            overflow-wrap: anywhere;
        }

        @media (max-width: 380px) {
            .small-title { letter-spacing: 3px; }
            .title { letter-spacing: 2px; }
        }

        @media (max-height: 480px) {
            .title { font-size: clamp(32px, 11vh, 64px); }
            .line { margin: 14px auto; }
            .small-title { margin-bottom: 8px; }
        }
    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="glow"></div>


    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <!-- =========================================
         SPLASH
    ========================================== -->

    <main class="splash">

        <div class="small-title">
            GUILD COMMUNICATION SYSTEM
        </div>


        <div class="title">
            ELITE FORCE
        </div>


        <div class="line"></div>


        <div class="created">

            CREATED BY
            <span>RAZA SHAH</span>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            INITIALIZING GUILD SYSTEM

        </div>


        <div class="loader">

            <div class="loader-bar"></div>

        </div>

    </main>


    <!-- =========================================
         PWA SERVICE WORKER
    ========================================== -->

    <script>

        // =========================================
        // SPLASH -> LOGIN
        // =========================================

        setTimeout(
            function () {

                window.location.href =
                    "{{ url_for('login') }}";

            },
            4000
        );

    </script>


    {% include '_pwa_install.html' %}
</body>

</html>
