<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0e2a4d"/>
      <stop offset="0.5" stop-color="#07142a"/>
      <stop offset="1" stop-color="#010308"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#19d3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#19d3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="0.25" stop-color="#9aa8b8"/>
      <stop offset="0.5" stop-color="#e6edf4"/>
      <stop offset="0.75" stop-color="#6c7a8b"/>
      <stop offset="1" stop-color="#c9d3de"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a7b4c3"/>
      <stop offset="1" stop-color="#5b6877"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2548"/>
      <stop offset="0.6" stop-color="#050f22"/>
      <stop offset="1" stop-color="#02060f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9af3ff"/>
      <stop offset="1" stop-color="#16b8ff"/>
    </linearGradient>
    <linearGradient id="textMetal" gradientUnits="userSpaceOnUse" x1="0" y1="720" x2="0" y2="910">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9c5d3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#19d3ff" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Shield outline -->
    <path id="shield" d="M242 160 L400 108 L512 140 L624 108 L782 160 L782 420 L512 700 L242 420 Z"/>

    <!-- Angular letters (stroke-only, styled by <use>) -->
    <g id="txt" fill="none">
      <!-- ELITE -->
      <g transform="translate(316 727)"><path d="M70 0H0V75H70M0 37H55"/></g>
      <g transform="translate(410 727)"><path d="M0 0V75H65"/></g>
      <g transform="translate(499 727)"><path d="M10 0V75"/></g>
      <g transform="translate(543 727)"><path d="M0 0H70M35 0V75"/></g>
      <g transform="translate(637 727)"><path d="M70 0H0V75H70M0 37H55"/></g>
      <!-- FORCE -->
      <g transform="translate(289 832)"><path d="M70 0H0V75M0 37H55"/></g>
      <g transform="translate(383 832)"><path d="M15 0H55L70 15V60L55 75H15L0 60V15Z"/></g>
      <g transform="translate(477 832)"><path d="M0 75V0H52L70 14V36L52 50H0M38 50L70 75"/></g>
      <g transform="translate(571 832)"><path d="M70 0H15L0 15V60L15 75H70"/></g>
      <g transform="translate(665 832)"><path d="M70 0H0V75H70M0 37H55"/></g>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <ellipse cx="512" cy="400" rx="470" ry="430" fill="url(#halo)"/>
  <!-- light rays -->
  <g opacity="0.12" fill="#19d3ff">
    <polygon points="512,400 80,0 200,0"/>
    <polygon points="512,400 944,0 824,0"/>
    <polygon points="512,400 0,300 0,420"/>
    <polygon points="512,400 1024,300 1024,420"/>
  </g>

  <!-- Shield outer glow -->
  <use href="#shield" fill="#19d3ff" opacity="0.7" filter="url(#glow)"/>

  <!-- Shield body: metallic frame -->
  <g filter="url(#shadow)">
    <use href="#shield" fill="url(#metal)" stroke="#e8f6ff" stroke-width="3"/>
  </g>
  <!-- bevel lines -->
  <use href="#shield" fill="none" stroke="#3c4856" stroke-width="2" opacity="0.7"
       transform="translate(512 400) scale(0.975) translate(-512 -400)"/>

  <!-- Inner shield -->
  <g transform="translate(512 392) scale(0.86) translate(-512 -392)">
    <use href="#shield" fill="url(#inner)" stroke="#1ad2ff" stroke-width="6"/>
  </g>
  <g transform="translate(512 392) scale(0.86) translate(-512 -392)" filter="url(#glowSm)" opacity="0.9">
    <use href="#shield" fill="none" stroke="#1ad2ff" stroke-width="6"/>
  </g>

  <!-- Side blade plates (symmetry accents) -->
  <polygon points="262,200 262,400 300,440 300,230" fill="url(#metalV)" opacity="0.85"/>
  <polygon points="762,200 762,400 724,440 724,230" fill="url(#metalV)" opacity="0.85"/>

  <!-- Emblem: rank chevrons -->
  <g id="emblem">
    <!-- glow -->
    <g filter="url(#glowSm)" opacity="0.9">
      <polygon points="372,270 512,350 652,270 652,312 512,402 372,312" fill="#19d3ff"/>
    </g>
    <polygon points="372,270 512,350 652,270 652,312 512,402 372,312" fill="url(#metalV)" stroke="#e8f6ff" stroke-width="2"/>
    <polygon points="372,342 512,422 652,342 652,384 512,474 372,384" fill="url(#metal)" stroke="#e8f6ff" stroke-width="2"/>
    <polygon points="418,414 512,474 606,414 606,446 512,512 418,446" fill="url(#cyan)" stroke="#ffffff" stroke-width="2"/>
    <!-- crown diamond -->
    <g filter="url(#glowSm)"><polygon points="512,196 556,244 512,292 468,244" fill="#19d3ff"/></g>
    <polygon points="512,196 556,244 512,292 468,244" fill="url(#cyan)" stroke="#fff" stroke-width="3"/>
    <polygon points="512,214 538,244 512,274 486,244" fill="#e9fdff" opacity="0.9"/>
  </g>

  <!-- Cinematic highlight on shield -->
  <polygon points="242,160 400,108 512,140 330,330 242,300" fill="url(#sheen)"/>

  <!-- Accent lines flanking text -->
  <g stroke="#1ad2ff" stroke-width="4" fill="none" opacity="0.9">
    <path d="M150 760H245L265 740"/>
    <path d="M874 760H779L759 740"/>
    <path d="M150 865H225L245 885"/>
    <path d="M874 865H799L779 885"/>
  </g>

  <!-- Text: glow, shadow, metallic fill -->
  <use href="#txt" stroke="#19d3ff" stroke-width="18" stroke-linejoin="miter" filter="url(#glow)" opacity="0.8"/>
  <use href="#txt" stroke="#000" stroke-width="20" stroke-linejoin="miter" transform="translate(0 6)" opacity="0.7"/>
  <use href="#txt" stroke="url(#textMetal)" stroke-width="15" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Vignette -->
  <rect width="1024" height="1024" fill="url(#vig)"/>
</svg>
